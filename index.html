<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamepad MIDI Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d4ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #2d3436;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #555;
        }
        .mapping-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .mapping-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 4px;
        }
        .mapping-btn {
            background: #0984e3;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            min-width: 40px;
        }
        .mapping-btn.waiting {
            background: #e17055;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        /* Preset Selector Visibility Fix */
        #preset-selector {
            color: #000000;
            background-color: #ffffff;
        }
        /* Track List Styles */
        .track-list-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        .track-list-table th, .track-list-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #444;
        }
        .track-list-table th {
            color: #aaa;
            font-weight: normal;
        }
        .track-row {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .track-row:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .track-row.active {
            background-color: rgba(9, 132, 227, 0.3);
            border-left: 3px solid #0984e3;
        }
        .status-on { color: #00b894; font-weight: bold; }
        .status-off { color: #636e72; }
        .status-mute { color: #d63031; font-weight: bold; }
        .track-btn {
            background: #2d3436;
            border: 1px solid #636e72;
            color: #b2bec3;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            min-width: 50px;
        }
        .track-btn.active {
            background: #00b894;
            color: white;
            border-color: #00cec9;
        }
        .track-btn.active-mute {
            background: #d63031;
            color: white;
            border-color: #ff7675;
        }
        /* Preset Browser Styles */
        .preset-browser {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .preset-search-box {
            display: flex;
            gap: 10px;
        }
        .preset-search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #1e272e;
            color: #dfe6e9;
            font-size: 14px;
        }

        .preset-info {
            display: flex;
            gap: 20px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            font-size: 12px;
            color: #b2bec3;
        }
        .preset-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* Loading Overlay Styles */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 4000;
            justify-content: center;
            align-items: center;
        }
        .loading-content {
            text-align: center;
            color: #dfe6e9;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2d3436;
            border-top: 4px solid #0984e3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-message {
            font-size: 16px;
            margin-bottom: 15px;
        }
        .loading-progress-container {
            width: 300px;
            height: 8px;
            background-color: #2d3436;
            border-radius: 4px;
            overflow: hidden;
            margin: 0 auto 10px;
        }
        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0984e3, #00cec9);
            width: 0%;
            transition: width 0.3s ease;
        }
        .loading-percent {
            font-size: 14px;
            color: #b2bec3;
        }
        /* ADSR Controls Styles */
        .adsr-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }
        .adsr-param {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .adsr-param label {
            font-size: 14px;
            color: #dfe6e9;
        }
        .adsr-param input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #0984e3, #00cec9);
            border-radius: 4px;
            outline: none;
        }
        .adsr-param input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .adsr-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .adsr-buttons button {
            flex: 1;
        }
    </style>
</head>

<body>
    <div id="app">
        <header class="glass-panel">
            <h1>GamePad <span class="accent">MIDI Seq</span></h1>
            <div class="controls">
                <button id="btn-play" class="icon-btn">▶</button>
                <button id="btn-stop" class="icon-btn">■</button>
                <button id="btn-add-marker" class="secondary-btn">Add Marker</button>
                <button id="btn-add-bpm" class="secondary-btn">Add BPM</button>
                <button id="btn-add-ts" class="secondary-btn">Add TS</button>
                <div class="divider"></div>
                <button id="btn-save" class="secondary-btn">Save</button>
                <button id="btn-load" class="secondary-btn">Load</button>
                <input type="file" id="file-input-project" accept=".json" style="display: none;">
                <button id="btn-export" class="secondary-btn">Export MIDI</button>
                <div class="divider"></div>
                <button id="btn-load-sfz" class="secondary-btn">SFZ</button>
                <input type="file" id="sfz-file-input" webkitdirectory directory multiple style="display: none;">
                <button id="btn-load-sf2" class="secondary-btn">SF2</button>
                <input type="file" id="sf2-file-input" accept=".sf2" style="display: none;">
                <button id="btn-preset-browser" class="secondary-btn">🎹 Presets</button>
                <select id="preset-selector" class="preset-select" disabled>
                    <option value="">-- No SF2 --</option>
                </select>
                <button id="btn-adsr" class="secondary-btn">🎛️ ADSR</button>
                <button id="btn-filter" class="secondary-btn">🔊 Filter</button>
                <select id="osc-preset-selector" class="preset-select">
                    <option value="Sine">Sine</option>
                    <option value="Square">Square</option>
                    <option value="Sawtooth">Sawtooth</option>
                    <option value="Triangle">Triangle</option>
                    <option value="Synth Lead">Synth Lead</option>
                    <option value="Synth Bass">Synth Bass</option>
                    <option value="Pad">Pad</option>
                    <option value="Pluck">Pluck</option>
                    <option value="Bell">Bell</option>
                </select>
                <div id="status-display">Ready</div>
            </div>
        </header>

        <main>
            <div id="canvas-container">
                <canvas id="piano-roll"></canvas>
            </div>
        </main>

        <div id="gamepad-status" class="glass-panel floating-status">
            Gamepad: <span id="gamepad-name">Disconnected</span>
        </div>

        <div id="cursor-info" class="glass-panel floating-info">
            T: <span id="time-val">0</span> | P: <span id="pitch-val">C4</span> | V: <span id="vel-val">100</span>
        </div>
    </div>

    <!-- Mapping Modal -->
    <div id="mapping-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2>Controller Mapping</h2>
            <div id="mapping-list" class="mapping-grid"></div>
            <div class="modal-actions">
                <button id="btn-reset-mapping" class="secondary-btn">Reset Defaults</button>
                <button id="btn-close-mapping" class="secondary-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- Track List Modal -->
    <div id="track-list-modal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 700px;">
            <h2>Track Overview</h2>
            <table class="track-list-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Instrument</th>
                        <th>Vol</th>
                        <th>Pan</th>
                        <th>Solo</th>
                        <th>Mute</th>
                    </tr>
                </thead>
                <tbody id="track-list-body"></tbody>
            </table>
            <div class="modal-actions">
                <button id="btn-close-tracklist" class="secondary-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- Preset Browser Modal -->
    <div id="preset-browser-modal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 600px;">
            <h2>Preset Browser</h2>
            <div class="preset-browser">
                <div class="preset-search-box">
                    <input type="text" id="preset-search-input" class="preset-search-input" placeholder="Search presets...">
                </div>
                <div class="preset-info">
                    <span id="preset-count">Presets: 0</span>
                    <span id="preset-font-name">Font: None</span>
                    <span id="preset-memory">Memory: 0 MB</span>
                </div>
                <div id="preset-list" class="preset-list">
                    <div class="preset-item">
                        <span class="preset-name">No sound font loaded</span>
                    </div>
                </div>
                <div class="preset-pagination">
                    <button id="btn-preset-prev" class="preset-pagination-btn" disabled>&lt; Prev</button>
                    <span id="preset-page-info">Page 1/1</span>
                    <button id="btn-preset-next" class="preset-pagination-btn" disabled>Next &gt;</button>
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-close-presetbrowser" class="secondary-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- ADSR Envelope Modal -->
    <div id="adsr-modal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 400px;">
            <h2>ADSR Envelope</h2>
            <div class="adsr-controls">
                <div class="adsr-param">
                    <label for="adsr-attack">Attack: <span id="adsr-attack-val">0.01</span>s</label>
                    <input type="range" id="adsr-attack" min="0.001" max="2" step="0.001" value="0.01">
                </div>
                <div class="adsr-param">
                    <label for="adsr-decay">Decay: <span id="adsr-decay-val">0.1</span>s</label>
                    <input type="range" id="adsr-decay" min="0.01" max="2" step="0.01" value="0.1">
                </div>
                <div class="adsr-param">
                    <label for="adsr-sustain">Sustain: <span id="adsr-sustain-val">0.7</span></label>
                    <input type="range" id="adsr-sustain" min="0" max="1" step="0.01" value="0.7">
                </div>
                <div class="adsr-param">
                    <label for="adsr-release">Release: <span id="adsr-release-val">0.1</span>s</label>
                    <input type="range" id="adsr-release" min="0.01" max="3" step="0.01" value="0.1">
                </div>
                <div class="adsr-buttons">
                    <button id="btn-adsr-preview" class="secondary-btn">Preview</button>
                    <button id="btn-adsr-reset" class="secondary-btn">Reset</button>
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-close-adsr" class="secondary-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- Filter Modal -->
    <div id="filter-modal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 400px;">
            <h2>Filter</h2>
            <div class="adsr-controls">
                <div class="adsr-param">
                    <label for="filter-type">Type</label>
                    <select id="filter-type" class="preset-select" style="width: 100%;">
                        <option value="lowpass">Lowpass</option>
                        <option value="highpass">Highpass</option>
                        <option value="bandpass">Bandpass</option>
                        <option value="notch">Notch</option>
                        <option value="allpass">Allpass</option>
                    </select>
                </div>
                <div class="adsr-param">
                    <label for="filter-cutoff">Cutoff: <span id="filter-cutoff-val">20000</span>Hz</label>
                    <input type="range" id="filter-cutoff" min="20" max="20000" step="10" value="20000">
                </div>
                <div class="adsr-param">
                    <label for="filter-resonance">Resonance: <span id="filter-resonance-val">1</span></label>
                    <input type="range" id="filter-resonance" min="0.1" max="20" step="0.1" value="1">
                </div>
                <div class="adsr-buttons">
                    <button id="btn-filter-preview" class="secondary-btn">Preview</button>
                    <button id="btn-filter-reset" class="secondary-btn">Reset</button>
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-close-filter" class="secondary-btn">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>

</html>
