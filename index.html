<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamepad MIDI Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1d21">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <header class="app-header">
            <div class="brand">GamePad <span class="accent">MIDI Seq</span></div>

            <nav class="view-tabs" title="SELECT long press: switch view">
                <button id="tab-song" class="view-tab">SONG</button>
                <button id="tab-pattern" class="view-tab">PATTERN <span id="tab-pattern-label" class="view-tab-label"></span></button>
            </nav>

            <div class="toolbar">
                <div class="toolbar-group">
                    <button id="btn-play" class="btn icon" title="Play / Stop (X)">▶</button>
                    <button id="btn-stop" class="btn icon" title="Stop">■</button>
                </div>

                <div class="toolbar-group">
                    <span class="toolbar-label">Marker</span>
                    <button id="btn-marker-prev" class="btn icon" title="Previous marker">◀</button>
                    <button id="btn-marker-next" class="btn icon" title="Next marker">▶</button>
                </div>

                <select id="preset-selector" class="select" disabled title="Instrument of the current track">
                    <option value="">-- No SF2 --</option>
                </select>

                <div class="menu">
                    <button class="btn" data-menu-toggle>ADD ▾</button>
                    <div class="menu-panel">
                        <button class="menu-item" data-action="add-marker">Marker</button>
                        <button class="menu-item" data-action="add-bpm">BPM</button>
                        <button class="menu-item" data-action="add-timesig">Time Signature</button>
                    </div>
                </div>

                <div class="menu">
                    <button class="btn" data-menu-toggle>FILE ▾</button>
                    <div class="menu-panel">
                        <button class="menu-item" data-action="save">Save Project</button>
                        <button class="menu-item" data-action="load">Load Project</button>
                        <button class="menu-item" data-action="export-midi">Export MIDI</button>
                        <div class="menu-separator"></div>
                        <button class="menu-item" data-action="load-sf2">Load SoundFont (SF2/SF3/DLS)</button>
                        <button class="menu-item" data-action="load-sfz">Load SFZ Folder</button>
                        <div class="menu-separator"></div>
                        <button class="menu-item" data-action="controller-map">Controller Map</button>
                    </div>
                </div>

                <div id="status-display" class="status">Ready</div>
            </div>

            <input type="file" id="file-input-project" accept=".json" hidden>
            <input type="file" id="sfz-file-input" webkitdirectory directory multiple hidden>
            <input type="file" id="sf2-file-input" accept=".sf2,.sf3,.dls" hidden>
        </header>

        <main>
            <div id="canvas-container">
                <canvas id="piano-roll"></canvas>
            </div>
            <div id="gamepad-status" class="hud hud-left">
                Gamepad: <span id="gamepad-name">Disconnected</span>
            </div>
            <div id="cursor-info" class="hud hud-right"></div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Generic dialog (replaces alert / prompt / confirm) -->
    <div id="dialog" class="modal">
        <div class="modal-content">
            <h2 id="dialog-title"></h2>
            <p id="dialog-message" class="modal-message"></p>
            <input id="dialog-input" class="input" type="text">
            <div class="modal-actions">
                <button id="dialog-cancel" class="btn">Cancel</button>
                <button id="dialog-ok" class="btn primary">OK</button>
            </div>
            <p class="modal-hint">Gamepad: A = OK, B = Cancel</p>
        </div>
    </div>

    <!-- Controller mapping -->
    <div id="mapping-modal" class="modal">
        <div class="modal-content">
            <h2>Controller Mapping</h2>
            <div id="mapping-list" class="mapping-grid"></div>
            <div class="modal-actions">
                <button id="btn-reset-mapping" class="btn">Reset Defaults</button>
                <button id="btn-close-mapping" class="btn primary">Close</button>
            </div>
        </div>
    </div>

    <!-- Track list -->
    <div id="track-list-modal" class="modal">
        <div class="modal-content wide">
            <h2>Track Overview</h2>
            <table class="track-list-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Instrument</th>
                        <th>Vol</th>
                        <th>Pan</th>
                        <th>Solo</th>
                        <th>Mute</th>
                    </tr>
                </thead>
                <tbody id="track-list-body"></tbody>
            </table>
            <div class="modal-actions">
                <button id="btn-close-tracklist" class="btn primary">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>

</html>
