<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamepad MIDI Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#cfcfca">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <header class="top">
            <div class="oled">
                <div class="oled-title">
                    <span id="oled-name"></span>
                    <span class="oled-sub" id="oled-sub"></span>
                    <select id="preset-selector" disabled title="Instrument of the current track">
                        <option value="">-- No SF2 --</option>
                    </select>
                </div>
                <div class="oled-params" id="oled-params"></div>
            </div>

            <div class="keys">
                <button class="k" id="tab-song" title="SELECT long press: switch view"><i></i><span>Song</span></button>
                <button class="k" id="tab-pattern" title="SELECT long press: switch view"><i></i><span>Pattern</span></button>
                <span class="sep"></span>
                <button class="k" id="btn-tone" title="Tone Editor (START + Y)"><i></i><span>Tone</span></button>
                <div class="menu">
                    <button class="k" data-menu-toggle><i></i><span>Add</span></button>
                    <div class="menu-panel">
                        <button class="menu-item" data-action="add-marker">Marker</button>
                        <button class="menu-item" data-action="add-bpm">Tempo change</button>
                        <button class="menu-item" data-action="add-timesig">Time signature</button>
                        <div class="menu-separator"></div>
                        <button class="menu-item" data-action="marker-prev">Go to previous marker</button>
                        <button class="menu-item" data-action="marker-next">Go to next marker</button>
                    </div>
                </div>
                <div class="menu">
                    <button class="k" data-menu-toggle><i></i><span>File</span></button>
                    <div class="menu-panel">
                        <button class="menu-item" data-action="save">Save project</button>
                        <button class="menu-item" data-action="load">Load project</button>
                        <button class="menu-item" data-action="export-midi">Export MIDI</button>
                        <div class="menu-separator"></div>
                        <button class="menu-item" data-action="load-sf2">Load SoundFont (SF2/SF3/DLS)</button>
                        <button class="menu-item" data-action="load-sfz">Load SFZ folder</button>
                        <div class="menu-separator"></div>
                        <button class="menu-item" data-action="controller-map">Controller map</button>
                    </div>
                </div>
            </div>

            <input type="file" id="file-input-project" accept=".json" hidden>
            <input type="file" id="sfz-file-input" webkitdirectory directory multiple hidden>
            <input type="file" id="sf2-file-input" accept=".sf2,.sf3,.dls" hidden>
        </header>

        <main>
            <div id="canvas-container">
                <canvas id="piano-roll"></canvas>
            </div>
        </main>

        <footer class="legend" id="legend"></footer>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Generic dialog (replaces alert / prompt / confirm) -->
    <div id="dialog" class="modal">
        <div class="modal-content">
            <h2 id="dialog-title"></h2>
            <p id="dialog-message" class="modal-message"></p>
            <input id="dialog-input" class="input" type="text">
            <div class="modal-actions">
                <button id="dialog-cancel" class="btn">Cancel</button>
                <button id="dialog-ok" class="btn primary">OK</button>
            </div>
            <p class="modal-hint">Gamepad: A = OK, B = Cancel</p>
        </div>
    </div>

    <!-- Tone editor (content is built by tone_editor.js) -->
    <div id="tone-modal" class="modal">
        <div class="modal-content tone-editor">
            <div class="tone-header">
                <h2>Tone Editor</h2>
                <div class="tone-track">
                    <button class="btn icon small" data-tone-prev title="Previous track (L1)">◀</button>
                    <span class="tone-track-name"></span>
                    <button class="btn icon small" data-tone-next title="Next track (R1)">▶</button>
                </div>
            </div>
            <div class="tone-body"></div>
            <div class="modal-actions">
                <p class="modal-hint tone-hint">D-pad: select · A + D-pad: change (R2: fast) · Y: reset · X: preview · B: close</p>
                <button class="btn" data-tone-reset-all>Reset All</button>
                <button class="btn" data-tone-preview>Preview</button>
                <button class="btn primary" data-tone-close>Close</button>
            </div>
        </div>
    </div>

    <!-- Controller mapping -->
    <div id="mapping-modal" class="modal">
        <div class="modal-content">
            <h2>Controller Mapping</h2>
            <div id="mapping-list" class="mapping-grid"></div>
            <div class="modal-actions">
                <button id="btn-reset-mapping" class="btn">Reset Defaults</button>
                <button id="btn-close-mapping" class="btn primary">Close</button>
            </div>
        </div>
    </div>

    <!-- Track list -->
    <div id="track-list-modal" class="modal">
        <div class="modal-content wide">
            <h2>Track Overview</h2>
            <table class="track-list-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Instrument</th>
                        <th>Vol</th>
                        <th>Pan</th>
                        <th>Solo</th>
                        <th>Mute</th>
                        <th>Tone</th>
                    </tr>
                </thead>
                <tbody id="track-list-body"></tbody>
            </table>
            <div class="modal-actions">
                <button id="btn-close-tracklist" class="btn primary">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>

</html>
